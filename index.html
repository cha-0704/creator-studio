  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #131e38 0%, #0a1122 55%, #050811 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      overflow-x: hidden;
      color: #f1f5f9;
    }

    /* 럭셔리 골드 크리스탈 돔 스테이지 (완전 고정형) */
    .lotto-stage {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 황금 베이스와 골드 링 3D 프레임 */
    .gold-machine-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* 하단 황금 돔 받침대 */
    .gold-base-pedestal {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      height: 38%;
      background: radial-gradient(ellipse at 50% 20%, #ffd966 0%, #d4af37 45%, #997a15 85%, #594406 100%);
      border-radius: 50% 50% 20% 20% / 70% 70% 30% 30%;
      box-shadow: 
        0 15px 35px rgba(0,0,0,0.8),
        inset 0 4px 8px rgba(255,255,255,0.7),
        inset 0 -8px 16px rgba(0,0,0,0.7);
      border: 2px solid rgba(255, 235, 150, 0.6);
      z-index: 6;
    }

    /* 골든 스파이럴 레일 링 */
    .gold-spiral-rail {
      position: absolute;
      top: 18%;
      left: 6%;
      width: 88%;
      height: 64%;
      border: 6px solid #e5c158;
      border-radius: 50%;
      transform: rotate(-15deg);
      box-shadow: 
        0 8px 20px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(255,255,255,0.8),
        inset 0 -2px 6px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 7;
    }

    .gold-pillar {
      position: absolute;
      bottom: 24%;
      right: 18%;
      width: 14px;
      height: 48px;
      background: linear-gradient(90deg, #997a15 0%, #ffd966 50%, #594406 100%);
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      z-index: 8;
    }

    /* 크리스탈 글래스 챔버 */
    .crystal-dome {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 30%, rgba(255, 255, 255, 0.12) 0%, rgba(30, 48, 80, 0.35) 60%, rgba(10, 16, 28, 0.75) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 
        inset 0 0 45px rgba(255, 255, 255, 0.15),
        inset 0 8px 20px rgba(255, 255, 255, 0.3),
        inset 0 -20px 40px rgba(0, 0, 0, 0.8),
        0 20px 50px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      z-index: 10;
    }

    .dome-glare {
      position: absolute;
      top: 5%;
      left: 18%;
      width: 65%;
      height: 35%;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.08) 60%, transparent 85%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 25;
      transform: rotate(-6deg);
    }

    /* 3D 로또 볼 스타일 */
    .result-ball {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      position: relative;
      animation: dropIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.15) forwards;
      box-shadow: inset 0 3px 5px rgba(255,255,255,0.8), inset 0 -4px 8px rgba(0,0,0,0.6), 0 8px 16px rgba(0,0,0,0.55);
      flex-shrink: 0;
    }

    @media (min-width: 400px) {
      .result-ball {
        width: 48px;
        height: 48px;
      }
    }

    .result-ball::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.3) 30%, transparent 60%);
      pointer-events: none;
    }

    .result-ball-inner {
      position: relative;
      z-index: 2;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at 40% 35%, #ffffff 0%, #e2e8f0 70%, #cbd5e1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      box-shadow: inset 0 1px 1px rgba(255,255,255,1), 0 2px 4px rgba(0,0,0,0.4);
    }

    @media (min-width: 400px) {
      .result-ball-inner {
        width: 26px;
        height: 26px;
        font-size: 14px;
      }
    }

    .result-slot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle, rgba(10,16,30,0.7) 0%, rgba(18,26,45,0.9) 100%);
      border: 2px dashed rgba(255, 215, 0, 0.35);
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #94a3b8;
      font-weight: bold;
    }

    @media (min-width: 400px) {
      .result-slot {
        width: 48px;
        height: 48px;
      }
    }

    @keyframes dropIn {
      0% { opacity: 0; transform: translateY(-40px) scale(0.6); }
      70% { opacity: 1; transform: translateY(4px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 골든 오렌지 CTA 버튼 */
    .btn-start-gold {
      background: linear-gradient(180deg, #ffc837 0%, #ff8008 100%);
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.6), 
        inset 0 -3px 0 rgba(0,0,0,0.3), 
        0 10px 25px rgba(255, 140, 0, 0.4);
      transition: all 0.15s ease-out;
    }
    .btn-start-gold:active {
      transform: translateY(3px);
      box-shadow: inset 0 2px 0 rgba(0,0,0,0.4), inset 0 -1px 0 rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.6);
    }

  <script>
    // ----------------------------------------------------
    // 1. Web Audio API Sound Synthesizer
    // ----------------------------------------------------
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.18, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.4);
          });
        }
      } catch (e) {}
    }

    // ----------------------------------------------------
    // 2. Ball Theme & Colors
    // ----------------------------------------------------
    const BALL_COLORS = {
      yellow: { top: '#fef08a', main: '#f59e0b', bottom: '#92400e', text: '#451a03', shadow: 'rgba(245,158,11,0.5)' },
      blue:   { top: '#93c5fd', main: '#2563eb', bottom: '#1e3a8a', text: '#172554', shadow: 'rgba(37,99,235,0.5)' },
      red:    { top: '#fca5a5', main: '#ef4444', bottom: '#991b1b', text: '#450a0a', shadow: 'rgba(239,68,68,0.5)' },
      grey:   { top: '#cbd5e1', main: '#64748b', bottom: '#1e293b', text: '#0f172a', shadow: 'rgba(100,116,139,0.5)' },
      green:  { top: '#86efac', main: '#10b981', bottom: '#064e3b', text: '#022c22', shadow: 'rgba(16,185,129,0.5)' }
    };

    function getBallTheme(num) {
      if (num <= 10) return BALL_COLORS.yellow;
      if (num <= 20) return BALL_COLORS.blue;
      if (num <= 30) return BALL_COLORS.red;
      if (num <= 40) return BALL_COLORS.grey;
      return BALL_COLORS.green;
    }

    // ----------------------------------------------------
    // 3. Canvas 3D Physics Balls (오직 돔 내부 공만 움직임)
    // ----------------------------------------------------
    const canvas = document.getElementById('lotteryCanvas');
    const ctx = canvas.getContext('2d');
    const domeWrapper = document.getElementById('domeWrapper');
    const extractBtn = document.getElementById('extractBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnLabel = document.getElementById('btnLabel');
    const resultsTray = document.getElementById('resultsTray');
    const resultStatusText = document.getElementById('resultStatusText');
    const multiGamesContainer = document.getElementById('multiGamesContainer');
    const btnMinus = document.getElementById('btnMinus');
    const btnPlus = document.getElementById('btnPlus');
    const gameCountText = document.getElementById('gameCountText');

    let gameCount = 5;
    let size = 260;
    let dpr = window.devicePixelRatio || 1;
    let radius = size / 2;
    let balls = [];
    const NUM_BALLS = 45;
    let ballRadius = 14;
    let isRunning = false;
    let extractedCount = 0;
    const MAX_EXTRACTS = 6;
    let extractTimer = null;

    function resizeCanvas() {
      const rect = domeWrapper.getBoundingClientRect();
      size = Math.floor(rect.width) || 260;
      dpr = window.devicePixelRatio || 1;
      
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      
      ctx.scale(dpr, dpr);
      radius = size / 2;
      ballRadius = Math.max(12, size * 0.052);
      
      balls.forEach(b => {
        b.radius = ballRadius;
      });
    }

    class Ball {
      constructor(num, x, y) {
        this.num = num;
        this.theme = getBallTheme(num);
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = Math.random() * 2;
        this.radius = ballRadius;
        this.mass = 1;
        this.isExtracted = false;
      }

      update(dt) {
        if (this.isExtracted) return;

        if (isRunning) {
          const distFromBottom = Math.hypot(this.x - radius, this.y - (size - 18));
          if (distFromBottom < radius * 0.8) {
            this.vy -= (32 + Math.random() * 32) * dt;
            this.vx += (Math.random() - 0.5) * 26 * dt;
          }

          const dx = this.x - radius;
          const dy = this.y - radius;
          this.vx += -dy * 1.35 * dt;
          this.vy += dx * 1.35 * dt;

          this.vx += (Math.random() - 0.5) * 16 * dt;
          this.vy += (Math.random() - 0.5) * 14 * dt;
          this.vy += 12 * dt;
        } else {
          this.vy += 32 * dt;
          this.vx *= 0.985;
          this.vy *= 0.985;
        }

        this.x += this.vx * dt * 30;
        this.y += this.vy * dt * 30;

        const dx = this.x - radius;
        const dy = this.y - radius;
        const dist = Math.hypot(dx, dy);
        const maxDist = radius - this.radius - 2;

        if (dist > maxDist) {
          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);

          this.x = radius + nx * maxDist;
          this.y = radius + ny * maxDist;

          const dot = this.vx * nx + this.vy * ny;
          if (dot > 0) {
            const vnX = dot * nx;
            const vnY = dot * ny;
            const vtX = this.vx - vnX;
            const vtY = this.vy - vnY;

            const restitution = isRunning ? 0.88 : 0.65;
            this.vx = vtX * 0.95 - vnX * restitution;
            this.vy = vtY * 0.95 - vnY * restitution;
          }
        }
      }

      draw(ctx) {
        if (this.isExtracted) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // 1. Drop shadow
        ctx.beginPath();
        ctx.arc(1.5, 2.5, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fill();

        // 2. 3D Spherical Sphere Gradient
        const sphereGrad = ctx.createRadialGradient(
          -this.radius * 0.32, -this.radius * 0.32, this.radius * 0.15,
          0, 0, this.radius
        );
        sphereGrad.addColorStop(0, this.theme.top);
        sphereGrad.addColorStop(0.45, this.theme.main);
        sphereGrad.addColorStop(1, this.theme.bottom);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = sphereGrad;
        ctx.fill();

        // 3. Specular Rim
        ctx.lineWidth = 0.8;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.stroke();

        // 4. White Center Badge
        const badgeRadius = this.radius * 0.58;
        const badgeGrad = ctx.createRadialGradient(-badgeRadius * 0.2, -badgeRadius * 0.2, 1, 0, 0, badgeRadius);
        badgeGrad.addColorStop(0, '#ffffff');
        badgeGrad.addColorStop(0.75, '#f1f5f9');
        badgeGrad.addColorStop(1, '#cbd5e1');

        ctx.beginPath();
        ctx.arc(0, 0, badgeRadius, 0, Math.PI * 2);
        ctx.fillStyle = badgeGrad;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 2;
        ctx.shadowOffsetY = 1;
        ctx.fill();
        ctx.shadowColor = 'transparent';

        // 5. Ball Number
        ctx.fillStyle = this.theme.text;
        ctx.font = `900 ${Math.round(this.radius * 0.72)}px Montserrat, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.num, 0, 0.8);

        // 6. Glare
        const glareRadius = this.radius * 0.38;
        const glareGrad = ctx.createRadialGradient(
          -this.radius * 0.35, -this.radius * 0.35, 0.5,
          -this.radius * 0.35, -this.radius * 0.35, glareRadius
        );
        glareGrad.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
        glareGrad.addColorStop(0.4, 'rgba(255, 255, 255, 0.4)');
        glareGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.beginPath();
        ctx.arc(-this.radius * 0.35, -this.radius * 0.35, glareRadius, 0, Math.PI * 2);
        ctx.fillStyle = glareGrad;
        ctx.fill();

        ctx.restore();
      }
    }

    function resolveBallCollisions() {
      for (let i = 0; i < balls.length; i++) {
        const b1 = balls[i];
        if (b1.isExtracted) continue;

        for (let j = i + 1; j < balls.length; j++) {
          const b2 = balls[j];
          if (b2.isExtracted) continue;

          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.radius + b2.radius;

          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) * 0.5;
            b1.x -= nx * overlap;
            b1.y -= ny * overlap;
            b2.x += nx * overlap;
            b2.y += ny * overlap;

            const kx = b1.vx - b2.vx;
            const ky = b1.vy - b2.vy;
            const p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

            if (p > 0) {
              const elasticity = isRunning ? 0.9 : 0.75;
              b1.vx -= p * b2.mass * nx * elasticity;
              b1.vy -= p * b2.mass * ny * elasticity;
              b2.vx += p * b1.mass * nx * elasticity;
              b2.vy += p * b1.mass * ny * elasticity;
            }
          }
        }
      }
    }

    function initBalls() {
      balls = [];
      const chamberRadius = radius - ballRadius - 6;
      
      for (let i = 1; i <= NUM_BALLS; i++) {
        let placed = false;
        let attempts = 0;
        let x = radius, y = radius;

        while (!placed && attempts < 250) {
          attempts++;
          const angle = Math.PI * 0.15 + Math.random() * Math.PI * 0.7;
          const r = Math.sqrt(Math.random()) * (chamberRadius - 6);
          const candidateX = radius + Math.cos(angle) * r;
          const candidateY = radius + Math.sin(angle) * r + 10;

          if (Math.hypot(candidateX - radius, candidateY - radius) <= chamberRadius) {
            let overlapping = false;
            for (const b of balls) {
              if (Math.hypot(candidateX - b.x, candidateY - b.y) < ballRadius * 1.8) {
                overlapping = true;
                break;
              }
            }
            if (!overlapping || attempts > 180) {
              x = candidateX;
              y = Math.min(candidateY, size - ballRadius - 8);
              placed = true;
            }
          }
        }

        const ball = new Ball(i, x, y);
        balls.push(ball);
      }
    }

    let lastFrameTime = performance.now();
    function animate(currentTime) {
      const delta = Math.min((currentTime - lastFrameTime) / 1000, 0.05);
      lastFrameTime = currentTime;

      ctx.clearRect(0, 0, size, size);

      balls.forEach(ball => ball.update(delta));
      resolveBallCollisions();
      balls.forEach(ball => ball.draw(ctx));

      requestAnimationFrame(animate);
    }

    // ----------------------------------------------------
    // 4. Extraction & Multi-Game Logic
    // ----------------------------------------------------
    function createResultBallElement(ball) {
      const resultBallEl = document.createElement('div');
      resultBallEl.className = 'result-ball';
      resultBallEl.style.background = `radial-gradient(circle at 35% 28%, ${ball.theme.top} 0%, ${ball.theme.main} 45%, ${ball.theme.bottom} 100%)`;
      resultBallEl.style.boxShadow = `0 8px 16px ${ball.theme.shadow}, inset 0 2px 4px rgba(255,255,255,0.7), inset 0 -3px 5px rgba(0,0,0,0.5)`;

      const innerNum = document.createElement('div');
      innerNum.className = 'result-ball-inner';
      innerNum.style.color = ball.theme.text;
      innerNum.textContent = ball.num;

      resultBallEl.appendChild(innerNum);
      return resultBallEl;
    }

    function extractOneBall() {
      if (extractedCount >= MAX_EXTRACTS) {
        stopDraw();
        return;
      }

      const remaining = balls.filter(b => !b.isExtracted);
      if (remaining.length === 0) return;

      const randomIndex = Math.floor(Math.random() * remaining.length);
      const chosenBall = remaining[randomIndex];
      chosenBall.isExtracted = true;
      extractedCount++;

      playSound('pop');

      const slot = resultsTray.querySelector(`[data-slot="${extractedCount}"]`);
      if (slot) {
        slot.innerHTML = '';
        slot.className = 'result-slot !border-none !shadow-none bg-transparent';
        slot.appendChild(createResultBallElement(chosenBall));
      }

      if (extractedCount >= MAX_EXTRACTS) {
        stopDraw();
        playSound('fanfare');
        if (window.confetti) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      }
    }

    function generateMultiGames() {
      multiGamesContainer.innerHTML = '';
      if (gameCount <= 1) return;

      const labels = ['A', 'B', 'C', 'D', 'E'];
      for (let i = 0; i < gameCount; i++) {
        const nums = [];
        while (nums.length < 6) {
          const r = Math.floor(Math.random() * 45) + 1;
          if (!nums.includes(r)) nums.push(r);
        }
        nums.sort((a, b) => a - b);

        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-black/40 px-3 py-1.5 rounded-xl border border-white/5';
        row.innerHTML = `
          <span class="font-black text-[#ffd700] w-5 text-xs">${labels[i] || (i+1)}</span>
          <div class="flex items-center gap-1">
            ${nums.map(n => {
              const th = getBallTheme(n);
              const isDark = (n > 10 && n <= 40);
              return `<span class="w-5 h-5 rounded-full font-bold flex items-center justify-center text-[10px]" style="background:${th.main}; color:${isDark ? '#fff' : '#000'}">${String(n).padStart(2, '0')}</span>`;
            }).join('')}
          </div>
        `;
        multiGamesContainer.appendChild(row);
      }
    }

    function startDraw() {
      isRunning = true;
      btnIcon.textContent = 'hourglass_top';
      btnLabel.textContent = '추첨 진행 중...';
      resultStatusText.textContent = '추첨 중...';

      balls.forEach(b => {
        if (!b.isExtracted) {
          b.vy = -(Math.random() * 30 + 20);
          b.vx = (Math.random() - 0.5) * 35;
        }
      });

      clearInterval(extractTimer);
      extractTimer = setInterval(() => {
        extractOneBall();
      }, 900);

      generateMultiGames();
    }

    function stopDraw() {
      isRunning = false;
      clearInterval(extractTimer);

      if (extractedCount >= MAX_EXTRACTS) {
        btnIcon.textContent = 'replay';
        btnLabel.textContent = '다시 추첨하기';
        resultStatusText.textContent = `${gameCount}게임 추첨 완료`;
      } else {
        btnIcon.textContent = 'play_arrow';
        btnLabel.textContent = 'START (행운의 번호 추첨)';
        resultStatusText.textContent = '대기 중';
      }
    }

    function resetDraw() {
      extractedCount = 0;
      isRunning = false;
      clearInterval(extractTimer);

      for (let i = 1; i <= MAX_EXTRACTS; i++) {
        const slot = resultsTray.querySelector(`[data-slot="${i}"]`);
        if (slot) {
          slot.className = 'result-slot';
          slot.innerHTML = `?`;
        }
      }

      multiGamesContainer.innerHTML = '';
      initBalls();
      stopDraw();
    }

    // Stepper Controls
    btnMinus.addEventListener('click', () => {
      if (gameCount > 1) {
        gameCount--;
        gameCountText.textContent = gameCount;
      }
    });

    btnPlus.addEventListener('click', () => {
      if (gameCount < 5) {
        gameCount++;
        gameCountText.textContent = gameCount;
      }
    });

    extractBtn.addEventListener('click', () => {
      if (extractedCount >= MAX_EXTRACTS) {
        resetDraw();
      } else if (!isRunning) {
        startDraw();
      } else {
        extractOneBall();
      }
    });

    domeWrapper.addEventListener('click', () => {
      playSound('pop');
      balls.forEach(b => {
        if (!b.isExtracted) {
          b.vx += (Math.random() - 0.5) * 20;
          b.vy -= (Math.random() * 16 + 8);
        }
      });
    });

    // Init & Resize
    window.addEventListener('load', () => {
      resizeCanvas();
      initBalls();
      requestAnimationFrame(animate);
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initBalls();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
